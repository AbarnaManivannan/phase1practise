version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo Installing Maven...
      - yum install -y maven

  build:
    commands:
      - echo Building the Java application...
      - mvn clean package
      - echo Making shell scripts executable...
      - chmod +x scripts/*.sh
      - echo Creating deployment package...
      - mkdir -p output
      - cp target/*.jar output/
      - cp appspec.yml output/
      - cp -r scripts output/
      - cd output
      - zip -r ../phase1practise.zip .
      - cd ..

artifacts:
  files:
    - phase1practise.zip
