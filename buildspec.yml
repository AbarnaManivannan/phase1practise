version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo Installing Maven...
      - yum install -y maven
  build:
    commands:
      - echo Building the Java application...
      - mvn clean package
      - echo Making shell scripts executable...
      - chmod +x scripts/*.sh
      - echo Creating deployment directory...
      - mkdir -p build
      - cp target/*.jar build/
      - cp appspec.yml build/
      - cp -r scripts build/
      - cd build
      - zip -r ../phase1practise.zip .
      - cd ..
      
  post_build:
    commands:
      - echo Build completed.

artifacts:
  files:
    - target/hello-world-1.0-SNAPSHOT-jar-with-dependencies.jar
    - appspec.yml
    - scripts/*
     - target/*.jar
  name: phase1practise.zip
