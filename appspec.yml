version: 0.0
os: linux

files:
  - source: hello-world-1.0-SNAPSHOT-jar-with-dependencies.jar
    destination: /home/ec2-user/app
  - source: scripts
    destination: /home/ec2-user/scripts

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: ec2-user

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: ec2-user

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ec2-user

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: ec2-user
