version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo Installing Maven...
      - yum install -y maven

  build:
    commands:
      - echo Building the Java application...
      - mvn clean package
      - echo Making shell scripts executable...
      - chmod +x scripts/*.sh
      - echo Creating deployment package...
      - mkdir -p output
      - cp target/*.jar output/  # Copy the JAR to the output folder
      - cp appspec.yml output/    # Copy the AppSpec file to the output folder
      - cp -r scripts output/     # Copy the scripts to the output folder
      - cd output
      - zip -r ../phase1practise.zip .  # Create the zip file
      - cd .. 

artifacts:
  files:
    - phase1practise.zip
  discard-paths: yes  # Optional: To remove directory paths in the artifact
